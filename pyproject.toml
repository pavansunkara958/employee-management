[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]   # S = flake8-bandit security rules
ignore = ["B008"]                     # FastAPI's Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E402"]          # assert is fine in tests; conftest sets env before imports

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
relative_files = true                 # Sonar needs paths relative to the repo root

[tool.coverage.report]
show_missing = true