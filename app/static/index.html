<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Management</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Employee Management v2</h1>
    <span id="health" class="badge badge-unknown" role="status">API: checking…</span>
  </header>

  <main>
    <!-- Dashboard cards (filled from /api/employees/stats) -->
    <section id="stats" class="stats" aria-label="Dashboard"></section>

    <!-- Toolbar -->
    <section class="toolbar">
      <input id="search" type="search" placeholder="Search name or email…" aria-label="Search">
      <select id="department-filter" aria-label="Filter by department">
        <option value="">All departments</option>
        <option>IT</option>
        <option>HR</option>
        <option>Finance</option>
        <option>Sales</option>
      </select>
      <button id="add-btn" class="btn btn-primary" type="button">+ Add Employee</button>
    </section>

    <!-- Employee table -->
    <section class="table-wrap">
      <table id="employee-table">
        <thead>
          <tr>
            <th><button class="sort" data-field="id" type="button">ID</button></th>
            <th><button class="sort" data-field="name" type="button">Name</button></th>
            <th><button class="sort" data-field="email" type="button">Email</button></th>
            <th><button class="sort" data-field="department" type="button">Department</button></th>
            <th><button class="sort" data-field="salary" type="button">Salary</button></th>
            <th class="actions-col">Actions</th>
          </tr>
        </thead>
        <tbody id="employee-rows"></tbody>
      </table>
      <p id="empty" class="empty" hidden>No employees found.</p>
    </section>

    <!-- Pagination -->
    <nav class="pager" aria-label="Pagination">
      <button id="prev" class="btn" type="button">‹ Prev</button>
      <span id="page-info"></span>
      <button id="next" class="btn" type="button">Next ›</button>
    </nav>
  </main>

  <!-- Add / Edit form -->
  <dialog id="form-dialog">
    <form id="employee-form" novalidate>
      <h2 id="form-title">Add Employee</h2>
      <label>Name
        <input name="name" required maxlength="100" autocomplete="off">
        <small class="field-error" data-for="name"></small>
      </label>
      <label>Email
        <input name="email" type="email" required autocomplete="off">
        <small class="field-error" data-for="email"></small>
      </label>
      <label>Department
        <select name="department" required>
          <option value="">Select…</option>
          <option>IT</option>
          <option>HR</option>
          <option>Finance</option>
          <option>Sales</option>
        </select>
        <small class="field-error" data-for="department"></small>
      </label>
      <label>Salary
        <input name="salary" type="number" min="0.01" step="0.01" required>
        <small class="field-error" data-for="salary"></small>
      </label>
      <p id="form-error" class="form-error"></p>
      <div class="dialog-actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Delete confirmation -->
  <dialog id="delete-dialog">
    <h2>Delete employee?</h2>
    <p><strong id="delete-name"></strong> (<span id="delete-email"></span>) will be removed.</p>
    <p class="muted">This cannot be undone.</p>
    <div class="dialog-actions">
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="button" id="confirm-delete" class="btn btn-danger">Delete</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="alert" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
