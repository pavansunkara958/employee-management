# Local development only: the app + PostgreSQL on your laptop.
# In AWS the app talks to RDS instead, and this file is not used.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: employees
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d employees"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No "ports:" — the database is reachable only by the app container,
    # mirroring the private RDS design in AWS.

  app:
    build: .
    image: employee-management:local
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: employees
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: